services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
      - REGISTRATION_OPEN=${REGISTRATION_OPEN:-1}
      - INVITE_CODE=${INVITE_CODE:-}
    volumes:
      - appdata:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  appdata:
