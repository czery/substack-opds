# Optional add-on for plain Docker (no Dokploy): adds Caddy as a reverse proxy
# with automatic HTTPS. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
